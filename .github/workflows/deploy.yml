name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ update ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      MICROCMS_SERVICE_DOMAIN: ${{ secrets.MICROCMS_SERVICE_DOMAIN }}
      MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Check MicroCMS environment
        run: |
          if [ -z "$MICROCMS_SERVICE_DOMAIN" ]; then
            echo "::error::MICROCMS_SERVICE_DOMAIN is missing"
            exit 1
          fi

          if [ -z "$MICROCMS_API_KEY" ]; then
            echo "::error::MICROCMS_API_KEY is missing"
            exit 1
          fi

          echo "MicroCMS environment variables are configured."
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          node-version: 22.23.4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
